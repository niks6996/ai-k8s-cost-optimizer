apiVersion: batch/v1
kind: CronJob
metadata:
  name: cost-optimizer
  namespace: cost-optimizer
  labels:
    app.kubernetes.io/name: ai-k8s-cost-optimizer
    app.kubernetes.io/component: optimizer
spec:
  schedule: "0 */6 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 900
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ai-k8s-cost-optimizer
            app.kubernetes.io/component: optimizer
        spec:
          serviceAccountName: cost-optimizer
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: optimizer
              image: ghcr.io/niks6996/ai-k8s-cost-optimizer:latest
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: false
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi