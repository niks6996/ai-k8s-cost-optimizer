apiVersion: apps/v1
kind: Deployment
metadata:
  name: optimizer-metrics
  namespace: cost-optimizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: optimizer-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: optimizer-metrics
    spec:
      serviceAccountName: ai-k8s-cost-optimizer
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: metrics
          image: ai-k8s-cost-optimizer:monitoring
          imagePullPolicy: IfNotPresent
          command: ["python", "app/metrics_server.py"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: METRICS_PORT
              value: "8000"
          ports:
            - name: metrics
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: optimizer-metrics
  namespace: cost-optimizer
spec:
  selector:
    app.kubernetes.io/name: optimizer-metrics
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics