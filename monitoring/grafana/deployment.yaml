apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
  dashboard-provider.yml: |
    apiVersion: 1
    providers:
      - name: ai-k8s-cost-optimizer
        orgId: 1
        folder: Kubernetes Optimizer
        type: file
        disableDeletion: true
        editable: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: monitoring
data:
  dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "id": null,
      "panels": [
        {
          "type": "stat",
          "title": "Workloads Analysed",
          "id": 1,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "optimizer_workloads_analyzed_total",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Optimizer Run Status",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "optimizer_run_success",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Over-Provisioned",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "optimizer_workloads_by_status{status=\"over_provisioned\"}",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Under-Provisioned",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "optimizer_workloads_by_status{status=\"under_provisioned\"}",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          }
        },
        {
          "type": "bargauge",
          "title": "Recommended CPU Requests (millicores)",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "optimizer_recommended_cpu_request_millicores",
              "legendFormat": "{{namespace}} / {{workload}}",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          }
        },
        {
          "type": "bargauge",
          "title": "Recommended Memory Requests (MiB)",
          "id": 6,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "optimizer_recommended_memory_request_mib",
              "legendFormat": "{{namespace}} / {{workload}}",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          }
        },
        {
          "type": "timeseries",
          "title": "Workload Status Counts",
          "id": 7,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "optimizer_workloads_by_status",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          }
        },
        {
          "type": "stat",
          "title": "Theoretical Monthly Savings",
          "id": 8,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "optimizer_theoretical_monthly_savings_total",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          }
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": [
        "kubernetes",
        "cost-optimization",
        "sre"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "timezone": "browser",
      "title": "AI Kubernetes Cost & Performance Optimizer",
      "uid": "optimizer-dashboard",
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/provider.yml
              subPath: dashboard-provider.yml
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards/dashboard.json
              subPath: dashboard.json
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboard
          configMap:
            name: grafana-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http