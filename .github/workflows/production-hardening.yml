name: Day 20 Production Hardening
on:
  push:
    branches: [main]
    paths: ["app/**","tests/**","Dockerfile",".github/workflows/production-hardening.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest bandit pip-audit
      - name: Run complete test suite
        run: python -m pytest -v
      - name: Static security scan
        run: bandit -r app -ll
      - name: Audit dependencies
        run: |
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt
          elif [ -f app/requirements.txt ]; then pip-audit -r app/requirements.txt
          else echo "No requirements file found"; fi
      - name: Verify numeric non-root Docker user
        run: grep -Eq '^USER[[:space:]]+[1-9][0-9]*(:[1-9][0-9]*)?[[:space:]]*$' Dockerfile
      - name: Check for committed private keys
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.md' -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' .; then exit 1; fi