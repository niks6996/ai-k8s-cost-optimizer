name: Validate Kubernetes Manifests

on:
  push:
    branches:
      - main
    paths:
      - "k8s/**"
      - ".github/workflows/validate-kubernetes.yml"

  pull_request:
    branches:
      - main
    paths:
      - "k8s/**"
      - ".github/workflows/validate-kubernetes.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-manifests:
    name: Validate Kubernetes YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Kubernetes manifests with Kubeconform
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0
        with:
          entrypoint: /kubeconform
          args: >-
            -strict
            -summary
            -verbose
            -kubernetes-version 1.31.0
            k8s/