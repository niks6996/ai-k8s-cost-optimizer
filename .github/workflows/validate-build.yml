name: Validate, Test, Secure and Publish Optimizer

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/validate-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/validate-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check -r app/requirements.txt

      - name: Validate Python syntax
        run: |
          python3 -m py_compile \
            app/main.py \
            app/optimizer.py \
            app/kubernetes_metrics.py \
            app/test_optimizer.py \
            app/test_kubernetes_metrics.py

      - name: Run unit tests
        working-directory: app
        run: python3 -m unittest discover -v -p "test_*.py"

      - name: Validate mock metrics JSON
        run: python3 -m json.tool app/metrics.json > /dev/null

      - name: Run optimizer in mock mode
        working-directory: app
        env:
          METRICS_SOURCE: mock
        run: python3 main.py

      - name: Validate direct-run recommendations
        run: |
          test -f app/recommendations.json
          grep -q '"pod": "frontend-app"' app/recommendations.json
          grep -q '"recommendations"' app/recommendations.json

      - name: Build Docker image
        run: docker build --tag ai-k8s-cost-optimizer:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ai-k8s-cost-optimizer:${{ github.sha }}
          format: table
          output: trivy-report.txt
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy security report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.txt
          if-no-files-found: error
          retention-days: 7

      - name: Run optimizer container in mock mode
        run: |
          docker run \
            --name cost-optimizer \
            --env METRICS_SOURCE=mock \
            ai-k8s-cost-optimizer:${{ github.sha }}

      - name: Display container logs
        if: always()
        run: docker logs cost-optimizer || true

      - name: Verify container completed successfully
        run: |
          EXIT_CODE="$(docker inspect cost-optimizer --format='{{.State.ExitCode}}')"
          echo "Container exit code: ${EXIT_CODE}"
          test "${EXIT_CODE}" -eq 0

      - name: Verify container runs as non-root
        run: |
          UID_VALUE="$(docker run --rm ai-k8s-cost-optimizer:${{ github.sha }} id -u)"
          echo "Runtime UID: ${UID_VALUE}"
          test "${UID_VALUE}" != "0"

      - name: Copy container recommendations
        run: |
          mkdir -p artifacts
          docker cp cost-optimizer:/app/recommendations.json artifacts/recommendations.json

      - name: Upload recommendation report
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-recommendations
          path: artifacts/recommendations.json
          if-no-files-found: error
          retention-days: 7

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image for GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ai-k8s-cost-optimizer:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          docker tag ai-k8s-cost-optimizer:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Publish image to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest